[project]
name = "percentile-engine"
version = "0.1.0"
description = "Scoring, occupation matching and report rendering for Percentile"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "numpy>=2.1",
    "pandas>=2.2",
    "jinja2>=3.1",
    "weasyprint>=63",
    "pyyaml>=6.0",
    "supabase>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    # Only the tests use this. The application talks to Supabase over its REST
    # API (app/db.py); the RLS and trigger tests need a raw connection so they
    # can `set local role` and impersonate, which REST cannot express.
    "psycopg[binary]>=3.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["report/templates/*", "content/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: needs a live Postgres via TEST_DATABASE_URL; skipped when unset",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
