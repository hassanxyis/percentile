# Percentile — report interpretation text (plan.md §14, R3).
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS A FORM. A PERSON WITH PSYCHOLOGY TRAINING FILLS IT IN.
#
# R3: "Interpretation text is written by a human with psychology training. The
# differentiator of this product is that a trained person wrote the
# interpretations. Generated interpretation copy is not defensible in a room
# with a PhD in it."
#
# Every `""` below is deliberately empty and must NOT be filled by a language
# model, including by the assistant that generated this file's structure. The
# loader (`app/content/__init__.py`) raises `InterpretationMissing` on any blank
# string a template asks for, so an unfinished file fails the render job rather
# than producing a PDF with a polite gap in it.
#
# To see what is still unwritten:
#     cd engine && python scripts/check_interpretations.py
#
# ── HOW TO WRITE THESE ───────────────────────────────────────────────────────
#
# Audience: a 16–18 year old in Pakistan, and the counsellor sitting with them.
#
# * R7 — no clinical language. Nothing here may read as diagnosis, treatment,
#   pathology or a health service. "You tend to..." not "you suffer from...".
#   Never "disorder", "symptom", "condition", "therapy", "patient", "treatment".
# * Describe tendencies, never fix a person's identity. "often prefers" beats
#   "is". A seventeen-year-old is allowed to change.
# * Never name a specific career here. Occupation suggestions come from the
#   matching engine and the psychologist's confirmed directions (§9.1) — a
#   sentence in this file recommending "medicine" would reach every student who
#   scored that way, having met none of them.
# * These are bands on a provisional scale (R4 — no local norms until n >= 300).
#   Do not write as though a score were a measured percentile.
# * 40–70 words is the space the layout gives each block. Longer will overflow
#   the page rather than being truncated.
#
# ── STRUCTURAL TEXT ──────────────────────────────────────────────────────────
#
# The strings under `report:` and `attribution:` are NOT interpretation — they
# are page furniture, method description and licence text. They are filled in,
# and the licence wording in particular is quoted verbatim from the licensor and
# must not be reworded. Everything else on this page is yours to write.

# ─────────────────────────────────────────────────────────────────────────────
# INTERESTS — RIASEC (§14 pp. 3–4)
# ─────────────────────────────────────────────────────────────────────────────
interests:
  # One paragraph per Holland letter, read when the letter appears in the
  # student's three-letter code. Written about the interest area itself, not
  # about the student's score in it.
  letters:
    R: ""   # Realistic  — practical, hands-on, tools, machines, outdoors
    I: ""   # Investigative — ideas, analysis, research, figuring things out
    A: ""   # Artistic — expression, design, originality, unstructured work
    S: ""   # Social — teaching, helping, working directly with people
    E: ""   # Enterprising — persuading, leading, selling, starting things
    C: ""   # Conventional — order, accuracy, records, clear procedures

  # How clearly the profile separated. `score_interests` returns exactly these
  # three band names (engine/app/scoring/interests.py).
  bands:
    well_differentiated: ""
    moderate: ""
    # §7.1: "The report must say this in words and tell the counsellor to
    # explore rather than recommend." This is the one band where the honest
    # message is that the questionnaire did not settle the question.
    undifferentiated: ""

  # Shown when the third letter of the code was decided by a gap too small to
  # rely on (`code_provisional`). Explains why the third letter may move.
  code_provisional: ""

  # Shown when two scales tied and the order was resolved by convention
  # (`tie_broken`), so a student comparing with a friend is not confused.
  tie_broken: ""

# ─────────────────────────────────────────────────────────────────────────────
# PERSONALITY — IPIP Big Five (§14 pp. 5–6)
# ─────────────────────────────────────────────────────────────────────────────
#
# Note the fifth domain is Emotional Stability, not Neuroticism
# (engine/app/scoring/personality.py: "a report handed to a seventeen-year-old
# should not lead with a negatively framed trait name"). Keep that framing.
#
# Five bands per domain, matching PROVISIONAL_BAND_CUTOFFS. Write "very low"
# and "low" with particular care: there is no bad end of any of these scales,
# and a student will read their lowest bar first.
personality:
  domains:
    O:   # Openness to Experience
      very low: ""
      low: ""
      average: ""
      high: ""
      very high: ""
    C:   # Conscientiousness
      very low: ""
      low: ""
      average: ""
      high: ""
      very high: ""
    E:   # Extraversion
      very low: ""
      low: ""
      average: ""
      high: ""
      very high: ""
    A:   # Agreeableness
      very low: ""
      low: ""
      average: ""
      high: ""
      very high: ""
    S:   # Emotional Stability
      very low: ""
      low: ""
      average: ""
      high: ""
      very high: ""

  # One paragraph on the page, explaining that these are provisional bands from
  # a first sample and not percentiles against Pakistani students (R4).
  provisional_note: ""

# ─────────────────────────────────────────────────────────────────────────────
# ENTREPRENEURIAL TENDENCY — GET2 (§14 p. 7)
# ─────────────────────────────────────────────────────────────────────────────
#
# R10: GET2 is provisional pending written permission from The Open University /
# Dr. Sally Caird. This whole page is omitted — not shown blank — when the
# module was not administered, which is every session today. Fill it when the
# module goes live; the loader will not ask for these strings before then.
get2:
  subscales:
    achievement: ""
    autonomy: ""
    creativity: ""
    risk_taking: ""
    control: ""
  bands:
    emerging: ""
    moderate: ""
    strong: ""
  # Shown when `entrepreneurial_flag` is true, explaining why extra
  # entrepreneurship-track occupations appear in the matches (§8).
  flag_note: ""

# ─────────────────────────────────────────────────────────────────────────────
# CROSS-INSTRUMENT — where the modules agree or pull against each other (p. 11)
# ─────────────────────────────────────────────────────────────────────────────
#
# The page a counsellor said students find most useful. It is also the easiest
# page to overclaim on: two instruments disagreeing is ordinary, not a problem
# to be solved. Statistical honesty (§9) applies — describe what the answers
# showed, never what the student "really is".
cross:
  # Opening paragraph for the page, whatever the pattern.
  intro: ""
  # Interests and personality point the same way.
  aligned: ""
  # They pull against each other — e.g. a Social code with low Extraversion.
  tension: ""
  # Nothing clear enough either way to comment on.
  unclear: ""

# ─────────────────────────────────────────────────────────────────────────────
# QUESTIONS TO BRING TO YOUR COUNSELLOR (§14 p. 12)
# ─────────────────────────────────────────────────────────────────────────────
#
# A written list — 4 to 7 entries. These are the questions the report wants the
# student to actually ask out loud, so write them in the student's voice, as
# they would say them. Replace the empty strings; add or remove lines freely.
questions:
  prompts:
    - ""
    - ""
    - ""
    - ""

# ─────────────────────────────────────────────────────────────────────────────
# STRUCTURAL TEXT — page furniture and method (NOT interpretation)
# ─────────────────────────────────────────────────────────────────────────────
report:
  # Page 2. R7 lives here: this page sets what the report is and is not.
  how_to_read:
    title: "How to read this report"
    body: >-
      This report describes what you told us about the activities you enjoy and
      how you tend to approach things. It is not a test you passed or failed,
      and it is not a measure of ability or of what you are capable of. Nothing
      here is a diagnosis or a health assessment.
      The results are a starting point for a conversation, not a verdict. People
      change, and answers given on a different day can come out differently. The
      most useful thing you can do with this report is take it to your counsellor
      and disagree with the parts that do not sound like you.
    limits: >-
      Two limits worth knowing. The scores are compared against provisional
      bands rather than against other Pakistani students, because we do not yet
      have a large enough local sample to do that honestly. And a questionnaire
      only knows what you told it — it has not met you, seen your work, or
      spoken to anyone who teaches you.

  # Page 10 heading and framing, above the psychologist's own words. The
  # rationale text on that page comes from `career_directions.rationale`, which
  # the reviewing psychologist wrote in M8 — never from this file.
  directions:
    title: "Your confirmed directions"
    body: >-
      These directions were chosen with you by the counsellor who reviewed your
      results, not generated automatically. The note under each one is in their
      words. They are a place to start looking, not a decision you are now
      committed to.

  # Page 8–9, above the occupation table. §8's labelling requirement.
  matches:
    title: "Occupations to look into"
    body: >-
      These occupations have interest profiles that resemble yours. Resembling
      your profile is not the same as being right for you: pay, entry routes,
      family circumstances and what is actually available where you live all
      matter and none of them are in this list. Occupations shown with a local
      pathway have a recognised study route in Pakistan.
    entrepreneurial_note: >-
      These are shown because of your entrepreneurial tendency results, not
      because they matched your interest profile most closely.

  # Page 13.
  method:
    title: "Method and attribution"
    body: >-
      Your interests were measured with the O*NET Interest Profiler Short Form,
      and your personality with the International Personality Item Pool
      Big-Five factor markers. Occupation suggestions come from comparing your
      interest profile against occupation profiles in the O*NET database, then
      filtering by the level of education a role typically requires.
      Every report is read by a counsellor before it is sent. Nothing in this
      report was released automatically.

  # Footer on every page, beside the organisation's name.
  confidential: "Private — for the named student and their counsellor."

  # ───────────────────────────────────────────────────────────────────────────
  # THE COHORT REPORT (§10, §14, M11)
  #
  # Nested under `report:` deliberately, and not as a top-level `cohort:` block.
  # Everything here is page furniture, method description and threshold
  # explanation for a document written to an INSTITUTION — it describes what was
  # measured and how, and says nothing about any individual. That is why it ships
  # written while the interpretive blocks above ship empty (R3).
  #
  # Two tests hold that line: `test_structural_and_attribution_text_is_written`
  # requires every `report.*` key to be non-blank, and
  # `test_the_shipped_interpretations_file_is_unwritten` requires the interpretive
  # remainder to stay blank. A top-level `cohort:` block would land on the wrong
  # side of both.
  #
  # §9's statistical honesty rules constrain every string below: never a
  # percentage on a denominator under 10 (the engine withholds it — see
  # `describe_rate`), never a cohort comparison without both n's, and never
  # "in the wrong field" where "classed misaligned by this instrument" is meant.
  cohort:
    title: "Cohort profile"
    subtitle: "What this group's answers show, and what they do not"

    how_to_read:
      title: "How to read this report"
      body: >-
        This report describes what one group of students told us about the
        activities they enjoy and how they tend to approach things. It is a
        picture of a set of questionnaire answers, not a measure of ability,
        potential or the quality of any teaching. Nothing in it is a diagnosis or
        a health assessment, and no individual student's results are reproduced
        here beyond the follow-up list on the last page.
        The most useful thing to do with it is to treat the patterns as questions
        worth asking, rather than as findings to act on directly.
      limits: >-
        Three limits worth knowing before reading on. The scores behind these
        figures are compared against provisional bands rather than against other
        Pakistani students, because there is not yet a large enough local sample
        to do that honestly. Where a group is smaller than ten students, this
        report gives you the count and the total and deliberately withholds a
        percentage, because a percentage of six people invites more confidence
        than six people can support. And a questionnaire only knows what students
        told it on one day.

    completion:
      title: "Who has completed what"
      body: >-
        Every student on the roster appears in this table, including those who
        have not started. The review column is shown separately from completion
        on purpose: a report that is waiting for a counsellor to review it is not
        the same as one a student has not begun, and only one of those is
        something the institution can chase.
      backlog_note: >-
        Students shown as awaiting review have finished the questionnaire and are
        waiting for a counsellor to go through their results. They have not been
        told that anything is late, and they will not be.

    excluded:
      title: "Students not included in these figures"
      body: >-
        Some questionnaires show response patterns that make the scores
        unreliable — the same answer repeated many times in a row, or an
        assessment completed faster than the questions can be read. Where two or
        more such patterns appear together, that student's results are left out of
        the figures in this report so they do not distort the group's picture.
        The students concerned are not named here, and their own reports are
        unaffected. This is a note about data quality, not about any individual,
        and the counsellor who administered the assessment is usually the person
        best placed to know why a questionnaire was rushed.
      none: >-
        No student's responses showed a pattern serious enough to leave them out
        of these figures.

    interests:
      title: "What this group is drawn to"
      body: >-
        Each student's strongest interest area, counted once. This is the first
        letter of their three-letter profile, so the totals below add up to the
        number of students included rather than to three times that number.
        A concentration in one or two areas is common in a class that shares a
        subject stream, and is not in itself a finding.

    personality:
      title: "How this group tends to work"
      body: >-
        The five areas below describe working style, not ability, and there is no
        good or bad end to any of them. Bands are provisional: they come from the
        published response ranges rather than from a comparison against other
        Pakistani students, which awaits a larger local sample.

    congruence:
      title: "Interests and intended fields"
      body: >-
        For each field students said they intend to enter, this compares a
        student's interest profile against the profile of the others heading into
        the same field. It answers one narrow question — do students choosing this
        field resemble each other — and nothing more. It is not a judgement about
        whether any student has chosen well, and a student classed as differing
        from their group may have excellent reasons that a questionnaire cannot
        see.
      method: >-
        Each student is compared against the average profile of the others
        heading into their field, with that student's own answers left out of the
        average. Leaving them out matters: a student who is part of the average
        they are measured against is partly being compared with themselves, and in
        a field chosen by only one student that comparison has no meaning at all.
        Those students are shown as "too few to compare" rather than being given a
        flattering score.
      thresholds: >-
        Three classes are used, on a scale from 0 to 1: aligned at 0.60 and above,
        partly aligned between 0.35 and 0.60, and differing below 0.35. These
        thresholds are provisional. They were chosen before local data existed and
        should be revisited once enough Pakistani students have completed the
        assessment to know where the real boundaries fall.
      too_few: >-
        Fields chosen by a single student are listed with their profile but
        without a comparison, because there is no one to compare them against.

    follow_up:
      title: "Students worth a conversation"
      body: >-
        These students are named because a conversation is the appropriate next
        step, not because anything is wrong. Two situations bring a student onto
        this list: their answers did not produce a clear interest profile, in
        which case exploring is more useful than recommending; or their interests
        differ from others heading into the same field, which is worth
        understanding rather than correcting.
      none: >-
        No student in this cohort met either condition for a follow-up
        conversation.

    method:
      title: "Method and attribution"
      body: >-
        Interests were measured with the O*NET Interest Profiler Short Form and
        personality with the International Personality Item Pool Big-Five factor
        markers. Interest profiles are compared using cosine similarity after each
        profile is centred on its own mean, which compares the shape of a profile
        rather than how many boxes a student ticked overall.
        Every individual student report is read by a counsellor before it is
        released. The figures in this report are machine-produced and have not
        been individually reviewed, which is why they describe patterns rather
        than people.

    confidential: "Private — for the named institution and its counselling staff."

