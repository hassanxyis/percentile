name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine

    # Plain Postgres, not the Supabase CLI. db/testing/0000_supabase_shim.sql
    # supplies the auth schema, auth.uid() and the anon/authenticated/
    # service_role roles that the migrations depend on; the pytest session
    # fixture applies shim → migrations → grants → seed. That keeps CI and a
    # developer's local run on one code path — no psql step to drift.
    #
    # The container's superuser is required: `create extension pgcrypto`
    # (0001_init.sql) and `create role ... bypassrls` both need it. Tests defeat
    # that user's RLS bypass with `set local role authenticated` instead.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: percentile_test
        ports:
          - 5432:5432
        # Without the health check the first test races container init.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      # WeasyPrint links against these at import time. Missing them is the
      # number-one cause of "works locally, blank PDF in production" (plan §18).
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz0b libfribidi0 \
            libcairo2 libgdk-pixbuf-2.0-0 fonts-dejavu-core

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # The R9 trigger and the RLS policies are enforced by Postgres, not by
      # Python. Without TEST_DATABASE_URL these tests skip silently, so CI is
      # the place that guarantees they actually run (plan §18.1, Appendix B).
      - name: Test
        run: pytest
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/percentile_test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Unit tests for the pure modules in web/lib — currently the roster CSV
      # parser, which is where M5's per-row validation behaviour is pinned down.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Build-time placeholders. Real values live in Vercel's env settings;
          # none of these are secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The service-role key bypasses row-level security. If it reaches a client
      # component or a NEXT_PUBLIC_ variable, every student record is public
      # (plan §4, §17.3). Fail the build rather than discover this in a bundle.
      - name: Service-role key must not reach the client
        run: bash scripts/check-service-role.sh
